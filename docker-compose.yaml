services:
  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma

  yaic:
    image: ghcr.io/pastukhov/yaic:latest
    depends_on:
      - chromadb
    env_file:
      - .env
    environment:
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC_IN: ${MQTT_TOPIC_IN:-yaic/input/+/image}
      MQTT_TOPIC_OUT: ${MQTT_TOPIC_OUT:-yaic/output}
      MQTT_TOPIC_STATUS: ${MQTT_TOPIC_STATUS:-yaic/status}
      MQTT_TOPIC_LOG: ${MQTT_TOPIC_LOG:-yaic/log}
      VLM_API_KEY: ${VLM_API_KEY:-none}
      VLM_ENDPOINT: ${VLM_ENDPOINT:-https://openrouter.ai/api/v1/chat/completions}
      VLM_MODEL: ${VLM_MODEL:-openrouter/auto}
      YAIC_LANGUAGE: ${YAIC_LANGUAGE:-ru}
      YAIC_INFERENCE_TIMEOUT: ${YAIC_INFERENCE_TIMEOUT:-60}
      YAIC_INFERENCE_TEMPERATURE: ${YAIC_INFERENCE_TEMPERATURE:-0.1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HA_TOKEN: ${HA_TOKEN:-}
      CHROMA_HOST: ${CHROMA_HOST:-chromadb}
      CHROMA_PORT: ${CHROMA_PORT:-8000}
      FACES_DIR: ${FACES_DIR:-/app/faces}
      FACE_SIMILARITY_HIGH: ${FACE_SIMILARITY_HIGH:-0.85}
      FACE_SIMILARITY_LOW: ${FACE_SIMILARITY_LOW:-0.60}
      CLASSIFY_STRANGER_ROLE: ${CLASSIFY_STRANGER_ROLE:-true}
      FACE_INDEX_ON_STARTUP: ${FACE_INDEX_ON_STARTUP:-true}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8080}
    volumes:
      - ./faces:/app/faces:ro
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  chroma_data:
