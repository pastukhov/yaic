[tool.poetry]
name = "yaic"
version = "0.1.0"
description = "Yet Another Image Classifier"
authors = ["Artem Pastukhov <artem.pastukhov@gmail.com>"]
readme = "README.md"
packages = [{ include = "yaic" }]

[tool.poetry.dependencies]
python = "^3.11"
paho-mqtt = "^1.6.1"
requests = "^2.31.0"
pydantic = "^2.12.5"
httpx = "^0.28.1"
insightface = ">=0.7.3"
onnxruntime = ">=1.17.0"
chromadb = ">=0.5.0"
fastapi = ">=0.111.0"
uvicorn = {extras = ["standard"], version = ">=0.29.0"}
numpy = ">=1.24.0"
opencv-python-headless = ">=4.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[tool.poetry.scripts]
yaic = "yaic.main:main"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"
